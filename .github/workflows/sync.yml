# ==============================================================================
# GITHUB ACTIONS WORKFLOW: Health Data Sync
# ==============================================================================
name: Health Data Sync (Every 60 Mins)

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger button

jobs:
  run-sync-robot:
    runs-on: ubuntu-latest
    
    steps:
      # 1. Download your code
      - name: Checkout Repository
        uses: actions/checkout@v3

      # 2. Install Python 3.11
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 3. Install the tools from requirements.txt
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # 4. Run the Python Script
      - name: Run Sync Script
        env:
          # Garmin Login (The 3 parts)
          GARMIN_PART1: ${{ secrets.GARMIN_PART1 }}
          GARMIN_PART2: ${{ secrets.GARMIN_PART2 }}
          GARMIN_PART3: ${{ secrets.GARMIN_PART3 }}
          
          # Google Drive Login (Your new 2TB Key)
          GDRIVE_OAUTH_JSON: ${{ secrets.GDRIVE_OAUTH_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python daily_sync.py
