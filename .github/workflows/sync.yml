# ==============================================================================
# GITHUB ACTIONS WORKFLOW (The Scheduler)
# This file acts as an alarm clock that wakes up your robot every 10 minutes.
# ==============================================================================

name: Health Data Sync (Every 10 Mins)

# ------------------------------------------------------------------------------
# TRIGGERS: Tells GitHub when to start the robot
# ------------------------------------------------------------------------------
on:
  schedule:
    # This runs the script every 10 minutes, 24/7.
    # Format: "Minute Hour Day Month DayOfWeek"
    - cron: '*/10 * * * *'
  
  # This adds a "Run workflow" button so you can test it manually at any time.
  workflow_dispatch:

# ------------------------------------------------------------------------------
# JOBS: The actual environment and steps the robot follows
# ------------------------------------------------------------------------------
jobs:
  run-sync-robot:
    # We use a standard Linux (Ubuntu) machine provided by GitHub.
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your code (including garmin_tokens.txt) to the machine.
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up the Python environment.
      # Using 3.11 avoids the "End of Life" warnings seen in older versions.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install the required tools (Garmin and Google Drive libraries).
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Execute the Brain Script.
      # The env section safely injects your secret Google keys into the robot.
      - name: Run Sync Script
        env:
          # Your Google Service Account JSON key (must be in GitHub Secrets)
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          
          # The ID of the folder in your Google Drive where files will be saved
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python daily_sync.py
