# ==============================================================================
# GITHUB ACTIONS WORKFLOW (The Scheduler)
# This file tells GitHub to wake up your robot every 10 minutes.
# ==============================================================================

name: Health Data Sync (Every 10 Mins)

# ------------------------------------------------------------------------------
# TRIGGERS: Tells GitHub when to start the robot
# ------------------------------------------------------------------------------
on:
  schedule:
    # Runs the script automatically every 10 minutes, 24/7.
    - cron: '*/10 * * * *'
  
  # Adds a manual "Run workflow" button in the GitHub Actions tab.
  workflow_dispatch:

# ------------------------------------------------------------------------------
# JOBS: The actual environment and work steps
# ------------------------------------------------------------------------------
jobs:
  run-sync-robot:
    runs-on: ubuntu-latest #
    
    steps:
      # Step 1: Download your code (including garmin_tokens.txt).
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Set up the Python environment (using stable version 3.11).
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # Step 3: Install necessary Garmin and Google libraries.
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Run the Sync Script and inject Google secrets.
      - name: Run Sync Script
        env:
          # Injects your Google Service Account JSON key securely.
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          
          # Injects the target folder ID from your Drive.
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python daily_sync.py
