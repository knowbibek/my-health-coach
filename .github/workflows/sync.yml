# ==============================================================================
# GITHUB ACTIONS WORKFLOW
# This is the "Alarm Clock" that wakes up the robot.
# ==============================================================================

name: Health Data Sync (Every 10 Mins)

# TRIGGERS: When should this run?
on:
  # 1. SCHEDULE: Run automatically on a timer
  schedule:
    # Cron syntax: "Minute Hour Day Month DayOfWeek"
    # "*/10" means "Every 10 minutes" (0, 10, 20, 30...)
    - cron: '*/10 * * * *'
  
  # 2. MANUAL: Allow me to click a button to run it anytime
  workflow_dispatch:

# JOBS: The actual work to be done
jobs:
  run-sync-robot:
    # The computer type to run on (Linux)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your code from this repository
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install Python (The language we use)
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      # Step 3: Install the tools (Garmin & Google libraries)
      - name: Install Dependencies
        run: |
          pip install -r requirements.txt

      # Step 4: Run the Python Script
      - name: Run Sync Script
        env:
          # We must pass the Secrets from GitHub Settings into the script
          GARMIN_TOKENS: ${{ secrets.GARMIN_TOKENS }}
          GDRIVE_JSON: ${{ secrets.GDRIVE_JSON }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: python daily_sync.py
