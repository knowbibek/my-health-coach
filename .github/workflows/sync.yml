# ==============================================================================
# GITHUB ACTIONS WORKFLOW (The Alarm Clock)
# This file tells GitHub when to wake up and run your robot.
# ==============================================================================

name: Health Data Sync (Every 10 Mins)

# ------------------------------------------------------------------------------
# TRIGGERS: When should this run?
# ------------------------------------------------------------------------------
on:
  # 1. AUTOMATIC: Run on a timer
  schedule:
    # Cron syntax: "Minute Hour Day Month DayOfWeek"
    # "*/10" means "Run at minute 0, 10, 20, 30, 40, 50" of every hour
    - cron: '*/10 * * * *'
  
  # 2. MANUAL: Allow me to click a "Run Now" button in the Actions tab
  workflow_dispatch:

# ------------------------------------------------------------------------------
# JOBS: The actual work needed to be done
# ------------------------------------------------------------------------------
jobs:
  run-sync-robot:
    # The computer operating system to run on (Linux is fastest/cheapest)
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Download your code from this repository to the Linux machine
      - name: Checkout Repository
        uses: actions/checkout@v3

      # Step 2: Install Python (The language our robot speaks)
      # We use version 3.11 to avoid "End of Life" warnings
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

